<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="{{ page_description }}">
<meta name="robots" content="{{ robots_content }}">
<meta name="theme-color" content="{{ theme_color }}">
<link rel="icon" href="{{ favicon_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ theme_stylesheet_url }}">
<link rel="stylesheet" href="{{ site_stylesheet_url }}">
<script>
  (function() {
    try {
      var saved = localStorage.getItem("als-theme-preference");
      var theme = (saved === "dark" || saved === "light") ? saved : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme-mode", theme);
    } catch(e) {}
  })();
</script>
<script type="module" src="{{ site_script_url }}"></script>
{{ canonical_link_html }}
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_description }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site_name }}">
<meta name="page-id" content="{{ page_id }}">
<meta name="page-type" content="{{ page_type }}">
<meta name="page-route" content="{{ canonical_path }}">
