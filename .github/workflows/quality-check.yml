name: Quality Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Run lint
        run: ruff check core scripts tests

      - name: Run prompt audit
        run: python3 scripts/audit_prompts.py --strict

      - name: Run build
        run: python3 scripts/build.py

      - name: Validate generated output
        run: python3 scripts/build.py --check

      - name: Run automated tests
        run: pytest

