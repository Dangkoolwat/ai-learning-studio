name: Quality Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run build
        run: python3 scripts/build.py

      - name: Validate generated output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          repo_root = Path(".")
          dist_dir = repo_root / "dist"
          template_paths = [
              repo_root / "templates/base.html",
              repo_root / "templates/partials/head.html",
              repo_root / "templates/partials/site-header.html",
              repo_root / "templates/partials/navigation.html",
              repo_root / "templates/partials/footer.html",
          ]
          html_paths = [
              dist_dir / "index.html",
              dist_dir / "ai-practice/index.html",
              dist_dir / "ready-to-use/index.html",
              dist_dir / "ai-assistant/index.html",
              dist_dir / "image-ai/index.html",
          ]
          expected_renderer_ids = ["landing", "static-prompt", "prompt-builder", "practice-timeline"]
          expected_control_block_types = ["prompt", "prompt-field", "timeline-step"]
          expected_renderer_counts = {
              "landing": 1,
              "static-prompt": 4,
              "prompt-builder": 0,
              "practice-timeline": 0,
          }

          for path in template_paths:
              if not path.is_file():
                  raise SystemExit(f"missing approved template file: {path}")

          manifest_path = dist_dir / "build-manifest.json"
          registry_path = dist_dir / "page-registry.json"
          navigation_path = dist_dir / "navigation.json"
          source_registry_path = repo_root / "data" / "page-registry.json"
          source_navigation_path = repo_root / "data" / "navigation.json"
          theme_registry_path = dist_dir / "themes" / "themes.json"
          theme_dir = dist_dir / "themes" / "studio-default"
          theme_tokens_path = theme_dir / "tokens.json"
          theme_style_path = theme_dir / "style.css"
          theme_manifest_path = theme_dir / "manifest.json"

          for path in (
              manifest_path,
              registry_path,
              navigation_path,
              theme_registry_path,
              theme_tokens_path,
              theme_style_path,
              theme_manifest_path,
              *html_paths,
          ):
              if not path.is_file():
                  raise SystemExit(f"missing generated file: {path}")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          page_registry = json.loads(registry_path.read_text(encoding="utf-8"))
          navigation = json.loads(navigation_path.read_text(encoding="utf-8"))
          source_page_registry = json.loads(source_registry_path.read_text(encoding="utf-8"))
          source_navigation = json.loads(source_navigation_path.read_text(encoding="utf-8"))
          theme_registry = json.loads(theme_registry_path.read_text(encoding="utf-8"))
          theme_tokens = json.loads(theme_tokens_path.read_text(encoding="utf-8"))
          theme_manifest = json.loads(theme_manifest_path.read_text(encoding="utf-8"))

          expected_template_files = [path.relative_to(repo_root).as_posix() for path in template_paths]
          if manifest.get("template_engine_version") != 1:
              raise SystemExit("manifest template engine version is incorrect")
          if manifest.get("template_source_files") != expected_template_files:
              raise SystemExit("manifest template source files are incorrect")
          if manifest.get("template_file_count") != len(template_paths):
              raise SystemExit("manifest template file count is incorrect")
          if manifest.get("rendered_page_template_count") != 5:
              raise SystemExit("manifest rendered page template count is incorrect")
          if manifest.get("partial_template_names") != ["head", "site-header", "navigation", "footer"]:
              raise SystemExit("manifest partial template names are incorrect")
          if manifest.get("navigation_item_count") != 4:
              raise SystemExit("manifest navigation item count is incorrect")
          if manifest.get("template_validation_status") != "validated":
              raise SystemExit("manifest template validation status is incorrect")
          if manifest.get("renderer_engine_version") != 1:
              raise SystemExit("manifest renderer engine version is incorrect")
          if manifest.get("approved_renderer_ids") != expected_renderer_ids:
              raise SystemExit("manifest approved renderer ids are incorrect")
          if manifest.get("renderer_count") != 4:
              raise SystemExit("manifest renderer count is incorrect")
          if manifest.get("rendered_page_count") != 5:
              raise SystemExit("manifest rendered page count is incorrect")
          if manifest.get("page_count_by_renderer_id") != expected_renderer_counts:
              raise SystemExit("manifest page count by renderer id is incorrect")
          if manifest.get("renderer_validation_status") != "validated":
              raise SystemExit("manifest renderer validation status is incorrect")
          if manifest.get("control_block_types") != expected_control_block_types:
              raise SystemExit("manifest control block types are incorrect")
          if manifest.get("total_prompt_count") != 4:
              raise SystemExit("manifest prompt count is incorrect")
          if manifest.get("total_prompt_field_count") != 0:
              raise SystemExit("manifest prompt-field count is incorrect")
          if manifest.get("total_timeline_step_count") != 0:
              raise SystemExit("manifest timeline-step count is incorrect")
          if manifest.get("renderer_warnings_count") != 5:
              raise SystemExit("manifest renderer warnings count is incorrect")
          if manifest.get("published_page_count") != 5:
              raise SystemExit("manifest does not report exactly five published pages")
          if manifest.get("draft_page_count") != 0:
              raise SystemExit("manifest unexpectedly reports draft pages")
          if manifest.get("registered_page_count") != 5:
              raise SystemExit("manifest does not report exactly five registered pages")
          if manifest.get("registry_version") != 1 or manifest.get("navigation_version") != 1:
              raise SystemExit("manifest versions are incorrect")
          if manifest.get("generated_routes") != ["/", "/ai-practice/", "/ready-to-use/", "/ai-assistant/", "/image-ai/"]:
              raise SystemExit("manifest routes do not match the confirmed routes")
          if any(not path.startswith("dist/") for path in manifest.get("generated_output_files", [])):
              raise SystemExit("manifest output files must stay inside dist/")
          if any(path.startswith("dist/templates/") for path in manifest.get("generated_output_files", [])):
              raise SystemExit("manifest output files must not include templates/")
          if any(path.endswith("design.md") for path in manifest.get("generated_output_files", [])):
              raise SystemExit("manifest output files must not include design.md")

          public_registry_pages = page_registry.get("pages")
          if not isinstance(public_registry_pages, list) or len(public_registry_pages) != 5:
              raise SystemExit("public registry must contain exactly five published pages")
          if page_registry != source_page_registry:
              raise SystemExit("public registry schema changed unexpectedly")
          if navigation != source_navigation:
              raise SystemExit("public navigation schema changed unexpectedly")
          if public_registry_pages[0].get("route") != "/":
              raise SystemExit("public registry does not include the root route first")
          if [page.get("route") for page in public_registry_pages] != ["/", "/ai-practice/", "/ready-to-use/", "/ai-assistant/", "/image-ai/"]:
              raise SystemExit("public registry routes are out of order")
          if any(page.get("status") != "published" for page in public_registry_pages):
              raise SystemExit("public registry contains a non-published page")
          if {page.get("type") for page in public_registry_pages} != {"landing", "static-prompt"}:
              raise SystemExit("public registry contains an unexpected page type")

          if theme_registry.get("version") != 1:
              raise SystemExit("theme registry version is incorrect")
          if theme_registry.get("active_theme") != "studio-default":
              raise SystemExit("theme registry active theme is incorrect")
          themes = theme_registry.get("themes")
          if not isinstance(themes, list) or len(themes) != 1:
              raise SystemExit("theme registry must contain exactly one theme")
          theme_entry = themes[0]
          if theme_entry.get("id") != "studio-default":
              raise SystemExit("theme registry id is incorrect")
          if theme_entry.get("status") != "active":
              raise SystemExit("theme registry status is incorrect")
          if theme_entry.get("manifest") != "themes/studio-default/manifest.json":
              raise SystemExit("theme registry manifest path is incorrect")
          if theme_entry.get("tokens") != "themes/studio-default/tokens.json":
              raise SystemExit("theme registry tokens path is incorrect")
          if theme_entry.get("style") != "themes/studio-default/style.css":
              raise SystemExit("theme registry style path is incorrect")

          if theme_manifest.get("id") != "studio-default":
              raise SystemExit("theme manifest id is incorrect")
          if theme_manifest.get("source") != "design/studio-default/design.md":
              raise SystemExit("theme manifest source path is incorrect")
          if theme_manifest.get("status") != "active":
              raise SystemExit("theme manifest status is incorrect")
          if theme_manifest.get("token_count") != 47:
              raise SystemExit("theme manifest token count is incorrect")
          if theme_manifest.get("files") != {
              "tokens": "themes/studio-default/tokens.json",
              "style": "themes/studio-default/style.css",
              "manifest": "themes/studio-default/manifest.json",
          }:
              raise SystemExit("theme manifest files are incorrect")

          expected_categories = ["colors", "typography", "spacing", "radius", "shadow", "layout"]
          if theme_tokens.get("theme", {}).get("id") != "studio-default":
              raise SystemExit("theme tokens id is incorrect")
          if list(theme_tokens.get("tokens", {}).keys()) != expected_categories:
              raise SystemExit("theme tokens categories are out of order or missing")
          if not all(
              token_entry.get("css_variable", "").startswith("--")
              for category in expected_categories
              for token_entry in theme_tokens.get("tokens", {}).get(category, {}).values()
          ):
              raise SystemExit("theme tokens css variables are malformed")

          def route_to_output_path(route: str) -> Path:
              if route == "/":
                  return dist_dir / "index.html"
              segments = [segment for segment in route.strip("/").split("/") if segment]
              return dist_dir.joinpath(*segments, "index.html")

          def route_href(current_output_path: Path, target_route: str) -> str:
              target_output_path = route_to_output_path(target_route)
              relative_path = os.path.relpath(target_output_path.parent, start=current_output_path.parent)
              href = Path(relative_path).as_posix()
              if href == ".":
                  return "./"
              if not href.endswith("/"):
                  href = f"{href}/"
              return href

          def file_href(current_output_path: Path, target_output_path: Path) -> str:
              return Path(os.path.relpath(target_output_path, start=current_output_path.parent)).as_posix()

          navigation_sections = navigation["sections"]
          expected_page_by_section = {
              page["section"]: page
              for page in public_registry_pages
              if page.get("navigation") and page.get("section") is not None
          }
          nav_link_re = re.compile(
              r'<li class="navigation-item(?: is-current)?">\s*'
              r'<a class="navigation-link" href="([^"]+)"(?: aria-current="page")?>([^<]+)</a>\s*'
              r'</li>',
              re.DOTALL,
          )

          def validate_page(page: dict[str, object]) -> None:
              current_output_path = route_to_output_path(str(page["route"]))
              html_text = current_output_path.read_text(encoding="utf-8")

              if not html_text.startswith("<!doctype html>\n"):
                  raise SystemExit(f"missing doctype in {current_output_path}")
              if html_text.count("<html") != 1 or html_text.count("<head>") != 1 or html_text.count("<body ") != 1:
                  raise SystemExit(f"shared page shell is incorrect in {current_output_path}")
              if html_text.count('<header class="site-header">') != 1:
                  raise SystemExit(f"missing site header in {current_output_path}")
              if html_text.count('<nav class="site-navigation"') != 1:
                  raise SystemExit(f"missing site navigation in {current_output_path}")
              if html_text.count('<main class="site-main" id="main-content">') != 1:
                  raise SystemExit(f"missing main region in {current_output_path}")
              if html_text.count(f'<article class="page-content page-content--{page["type"]}">') != 1:
                  raise SystemExit(f"missing page-type article region in {current_output_path}")
              if html_text.count('<footer class="site-footer">') != 1:
                  raise SystemExit(f"missing footer in {current_output_path}")
              if html_text.count('<link rel="stylesheet"') != 1:
                  raise SystemExit(f"stylesheet link count is incorrect in {current_output_path}")
              if html_text.count('<a class="navigation-link"') != 4:
                  raise SystemExit(f"navigation link count is incorrect in {current_output_path}")
              if html_text.count("<h1>") != 1:
                  raise SystemExit(f"page-level H1 count is incorrect in {current_output_path}")
              if 'data-theme="studio-default"' not in html_text:
                  raise SystemExit(f"missing theme data attribute in {current_output_path}")
              if f'<html lang="{page["lang"]}" data-theme="studio-default">' not in html_text:
                  raise SystemExit(f"html metadata is incorrect in {current_output_path}")
              body_class = f'page page-type-{page["type"]} page-id-{page["id"]}'
              if page.get("section"):
                  body_class = f"{body_class} page-section-{page['section']}"
              if f'<body class="{body_class}" data-page-id="{page["id"]}" data-page-type="{page["type"]}" data-page-section="{page.get("section") or ""}">' not in html_text:
                  raise SystemExit(f"body metadata is incorrect in {current_output_path}")
              if f'<meta name="page-id" content="{page["id"]}">' not in html_text:
                  raise SystemExit(f"page-id metadata is incorrect in {current_output_path}")
              if f'<meta name="page-type" content="{page["type"]}">' not in html_text:
                  raise SystemExit(f"page-type metadata is incorrect in {current_output_path}")
              if f'<meta name="page-route" content="{page["route"]}">' not in html_text:
                  raise SystemExit(f"page-route metadata is incorrect in {current_output_path}")
              expected_home_href = route_href(current_output_path, "/")
              if f'<a class="site-brand" href="{expected_home_href}">AI Learning Studio</a>' not in html_text:
                  raise SystemExit(f"home link is incorrect in {current_output_path}")
              expected_style_href = file_href(current_output_path, theme_style_path)
              if f'<link rel="stylesheet" href="{expected_style_href}">' not in html_text:
                  raise SystemExit(f"theme stylesheet link is incorrect in {current_output_path}")
              if '```prompt' in html_text or '```prompt-field' in html_text or '```timeline-step' in html_text:
                  raise SystemExit(f"renderer control fence remained in {current_output_path}")
              if "{{" in html_text or "}}" in html_text:
                  raise SystemExit(f"unresolved template placeholder remained in {current_output_path}")
              if "<script" in html_text.lower() or "<style" in html_text.lower():
                  raise SystemExit(f"script or style tag remained in {current_output_path}")
              if re.search(r"\sstyle\s*=", html_text, flags=re.IGNORECASE):
                  raise SystemExit(f"inline style attribute remained in {current_output_path}")
              if re.search(r"\son[a-z0-9_-]+\s*=", html_text, flags=re.IGNORECASE):
                  raise SystemExit(f"inline event handler remained in {current_output_path}")
              if "http://" in html_text.lower() or "https://" in html_text.lower() or "://" in html_text:
                  raise SystemExit(f"external URL remained in {current_output_path}")

              navigation_entries = nav_link_re.findall(html_text)
              if len(navigation_entries) != 4:
                  raise SystemExit(f"navigation markup is incorrect in {current_output_path}")
              for index, section in enumerate(navigation_sections):
                  expected_page = expected_page_by_section.get(section["id"])
                  if expected_page is None:
                      raise SystemExit(f"navigation section page is missing for {section['id']} in {current_output_path}")
                  href, label = navigation_entries[index]
                  expected_href = route_href(current_output_path, str(expected_page["route"]))
                  if href != expected_href:
                      raise SystemExit(f"navigation href is incorrect for {section['id']} in {current_output_path}")
                  if label != section["label"]:
                      raise SystemExit(f"navigation label is incorrect for {section['id']} in {current_output_path}")
              if page["route"] == "/":
                  if html_text.count('aria-current="page"') != 0:
                      raise SystemExit(f"root page must not mark a section current in {current_output_path}")
                  if page["type"] != "landing":
                      raise SystemExit(f"root page must use the landing renderer in {current_output_path}")
              else:
                  if html_text.count('aria-current="page"') != 1:
                      raise SystemExit(f"section page must mark exactly one current item in {current_output_path}")
                  if page["type"] != "static-prompt":
                      raise SystemExit(f"non-root page must not use the landing renderer in {current_output_path}")

              if page["type"] == "static-prompt":
                  if '<section class="prompt-collection" aria-label="프롬프트 모음">' not in html_text:
                      raise SystemExit(f"static-prompt page is missing a prompt collection in {current_output_path}")
                  prompt_items = re.findall(r'<article class="prompt-item">', html_text)
                  if len(prompt_items) < 1:
                      raise SystemExit(f"static-prompt page is missing prompt items in {current_output_path}")
                  prompt_code_blocks = re.findall(
                      r'<pre class="prompt-item__content"><code>(.*?)</code></pre>',
                      html_text,
                      flags=re.DOTALL,
                  )
                  if not prompt_code_blocks:
                      raise SystemExit(f"static-prompt page is missing prompt code blocks in {current_output_path}")
                  if any("<" in block for block in prompt_code_blocks):
                      raise SystemExit(f"prompt body is not escaped in {current_output_path}")
              elif page["type"] == "prompt-builder":
                  if '<section class="prompt-builder" aria-label="프롬프트 작성 항목">' not in html_text:
                      raise SystemExit(f"prompt-builder page is missing the worksheet section in {current_output_path}")
                  if "<form" in html_text or "<input" in html_text or "<textarea" in html_text or "<select" in html_text or "<button" in html_text:
                      raise SystemExit(f"prompt-builder page contains interactive form controls in {current_output_path}")
              elif page["type"] == "practice-timeline":
                  if '<section class="practice-timeline" aria-label="실습 단계">' not in html_text:
                      raise SystemExit(f"practice-timeline page is missing the timeline section in {current_output_path}")
                  if "<button" in html_text:
                      raise SystemExit(f"practice-timeline page contains interactive controls in {current_output_path}")

              if html_text.count('<article class="page-content page-content--') != 1:
                  raise SystemExit(f"article class is incorrect in {current_output_path}")

          for page in public_registry_pages:
              validate_page(page)

          if any("templates/" in path for path in manifest.get("generated_output_files", [])):
              raise SystemExit("generated output unexpectedly includes templates/")
          if any(path.endswith("design.md") for path in manifest.get("generated_output_files", [])):
              raise SystemExit("generated output unexpectedly includes design.md")
          if any(path.endswith(".py") and "renderer" in path for path in manifest.get("generated_output_files", [])):
              raise SystemExit("generated output unexpectedly includes a renderer source file")
          PY
