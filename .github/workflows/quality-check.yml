name: Quality Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run build
        run: python3 scripts/build.py

      - name: Validate generated output
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import json
          import re

          repo_root = Path(".")
          dist_dir = repo_root / "dist"
          components_dir = repo_root / "components"
          source_data_dir = repo_root / "data"

          def load_json(path: Path) -> dict[str, object]:
              return json.loads(path.read_text(encoding="utf-8"))

          def assert_true(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(message)

          def assert_equal(actual, expected, message: str) -> None:
              if actual != expected:
                  raise SystemExit(message)

          def assert_template_is_sanitized(path: Path) -> None:
              text = path.read_text(encoding="utf-8")
              lower = text.lower()
              forbidden_checks = (
                  "<html",
                  "<head",
                  "<body",
                  "<main",
                  "<script",
                  "<style",
                  "<form",
                  "<input",
                  "<textarea",
                  "<select",
                  "<button",
                  "http://",
                  "https://",
                  "://",
              )
              for needle in forbidden_checks:
                  assert_true(needle not in lower, f"forbidden content in component template: {path}")
              assert_true(not re.search(r"\son[a-z0-9_-]+\s*=", text, flags=re.IGNORECASE), f"inline handler in component template: {path}")
              assert_true(not re.search(r"\sstyle\s*=", text, flags=re.IGNORECASE), f"inline style in component template: {path}")

          component_files = [
              "components/page-intro.html",
              "components/page-body.html",
              "components/prompt-collection.html",
              "components/prompt-item.html",
              "components/prompt-builder.html",
              "components/prompt-field.html",
              "components/practice-timeline.html",
              "components/timeline-step.html",
          ]
          expected_component_ids = [
              "page-intro",
              "page-body",
              "prompt-collection",
              "prompt-item",
              "prompt-builder",
              "prompt-field",
              "practice-timeline",
              "timeline-step",
          ]
          expected_component_render_counts = {
              "page-intro": 5,
              "page-body": 5,
              "prompt-collection": 4,
              "prompt-item": 4,
              "prompt-builder": 0,
              "prompt-field": 0,
              "practice-timeline": 0,
              "timeline-step": 0,
          }
          expected_component_template_paths = component_files
          expected_page_routes = ["/", "/ai-practice/", "/ready-to-use/", "/ai-assistant/", "/image-ai/"]
          expected_page_ids = ["home", "ai-practice", "ready-to-use", "ai-assistant", "image-ai"]
          expected_navigation_sections = [
              {"id": "ai-practice", "label": "AI 체험 실습", "order": 1},
              {"id": "ready-to-use", "label": "바로 사용하기", "order": 2},
              {"id": "ai-assistant", "label": "AI 도우미", "order": 3},
              {"id": "image-ai", "label": "이미지 AI", "order": 4},
          ]
          expected_component_template_counts = {
              "plain_text_placeholder_count": 13,
              "trusted_html_placeholder_count": 6,
              "component_count": 8,
              "component_template_file_count": 8,
              "total_component_render_count": 18,
              "component_warning_count": 0,
          }

          manifest = load_json(dist_dir / "build-manifest.json")
          public_registry = load_json(dist_dir / "page-registry.json")
          public_navigation = load_json(dist_dir / "navigation.json")
          theme_registry = load_json(dist_dir / "themes" / "themes.json")
          source_registry = load_json(source_data_dir / "page-registry.json")
          source_navigation = load_json(source_data_dir / "navigation.json")

          assert_equal(public_registry, source_registry, "public page registry changed unexpectedly")
          assert_equal(public_navigation, source_navigation, "public navigation changed unexpectedly")
          assert_equal(public_registry.get("pages", []), source_registry.get("pages", []), "public page registry pages changed unexpectedly")
          assert_equal([page["id"] for page in public_registry["pages"]], expected_page_ids, "published page order changed unexpectedly")
          assert_equal([page["route"] for page in public_registry["pages"]], expected_page_routes, "published page routes changed unexpectedly")
          assert_equal(public_navigation["sections"], expected_navigation_sections, "navigation sections changed unexpectedly")
          assert_equal(theme_registry["active_theme"], "studio-default", "active theme changed unexpectedly")
          assert_equal([theme["id"] for theme in theme_registry["themes"]], ["studio-default"], "theme registry changed unexpectedly")

          for relative_path in component_files:
              path = repo_root / relative_path
              assert_true(path.is_file(), f"missing component template: {relative_path}")
              assert_template_is_sanitized(path)

          assert_equal(manifest["component_engine_version"], 1, "component engine version is incorrect")
          assert_equal(manifest["component_validation_status"], "validated", "component validation status is incorrect")
          assert_equal(manifest["registered_component_ids"], expected_component_ids, "registered component ids are incorrect")
          assert_equal(len(set(manifest["registered_component_ids"])), len(manifest["registered_component_ids"]), "component ids must be unique")
          assert_equal(manifest["component_count"], expected_component_template_counts["component_count"], "component count is incorrect")
          assert_equal(manifest["component_template_file_count"], expected_component_template_counts["component_template_file_count"], "component template file count is incorrect")
          assert_equal(manifest["component_template_source_paths"], expected_component_template_paths, "component template source paths are incorrect")
          assert_equal(manifest["optional_component_ids_enabled"], [], "optional component ids should be empty")
          assert_equal(manifest["plain_text_placeholder_count"], expected_component_template_counts["plain_text_placeholder_count"], "plain-text placeholder count is incorrect")
          assert_equal(manifest["trusted_html_placeholder_count"], expected_component_template_counts["trusted_html_placeholder_count"], "trusted-html placeholder count is incorrect")
          assert_equal(manifest["total_component_render_count"], expected_component_template_counts["total_component_render_count"], "component render count is incorrect")
          assert_equal(manifest["component_warning_count"], expected_component_template_counts["component_warning_count"], "component warning count is incorrect")
          assert_equal(manifest["component_render_count_by_component_id"], expected_component_render_counts, "component render counts by id are incorrect")

          assert_equal(manifest["template_engine_version"], 1, "template engine version is incorrect")
          assert_equal(manifest["renderer_engine_version"], 1, "renderer engine version is incorrect")
          assert_equal(manifest["template_validation_status"], "validated", "template validation status is incorrect")
          assert_equal(manifest["renderer_validation_status"], "validated", "renderer validation status is incorrect")
          assert_equal(manifest["generated_routes"], expected_page_routes, "generated routes changed unexpectedly")
          assert_equal(manifest["published_page_count"], 5, "published page count is incorrect")
          assert_equal(manifest["registered_page_count"], 5, "registered page count is incorrect")
          assert_equal(manifest["rendered_page_count"], 5, "rendered page count is incorrect")
          assert_equal(manifest["renderer_warnings_count"], 5, "renderer warnings count is incorrect")
          assert_equal(manifest["total_prompt_count"], 4, "prompt block count is incorrect")
          assert_equal(manifest["total_prompt_field_count"], 0, "prompt-field block count should be zero")
          assert_equal(manifest["total_timeline_step_count"], 0, "timeline-step block count should be zero")

          expected_html_files = [
              dist_dir / "index.html",
              dist_dir / "ai-practice" / "index.html",
              dist_dir / "ready-to-use" / "index.html",
              dist_dir / "ai-assistant" / "index.html",
              dist_dir / "image-ai" / "index.html",
          ]
          for path in expected_html_files:
              assert_true(path.is_file(), f"missing generated html: {path}")

          forbidden_component_paths = [path for path in dist_dir.rglob("*") if "components" in path.parts]
          assert_equal(forbidden_component_paths, [], "component source files must not be published in dist/")

          def check_page_html(path: Path, *, expect_prompt_collection: bool) -> None:
              html = path.read_text(encoding="utf-8")
              assert_true(html.startswith("<!doctype html>\n"), f"doctype is missing in {path}")
              assert_true(html.count('<header class="page-intro">') == 1, f"page intro is missing in {path}")
              assert_true(html.count('<h1 class="page-title">') == 1, f"page title is missing in {path}")
              assert_true(html.count('<div class="page-body">') == 1, f"page body is missing in {path}")
              assert_true("{{" not in html and "}}" not in html, f"unresolved component placeholder in {path}")
              assert_true("components/" not in html, f"component source path leaked into {path}")
              assert_true("<script" not in html.lower(), f"script tag leaked into {path}")
              assert_true("<style" not in html.lower(), f"style tag leaked into {path}")
              assert_true("http://" not in html.lower() and "https://" not in html.lower(), f"external URL leaked into {path}")
              assert_true(re.search(r"\son[a-z0-9_-]+\s*=", html, flags=re.IGNORECASE) is None, f"inline event handler leaked into {path}")
              if expect_prompt_collection:
                  assert_true(html.count('<section class="prompt-collection" aria-label="프롬프트 모음">') == 1, f"prompt collection is missing in {path}")
                  assert_true(html.count('<article class="prompt-item">') == 1, f"prompt item count is incorrect in {path}")
                  assert_true(html.count('<h2 class="prompt-item__title">') == 1, f"prompt item title is missing in {path}")
              else:
                  assert_true('<section class="prompt-collection" aria-label="프롬프트 모음">' not in html, f"unexpected prompt collection in {path}")

          check_page_html(dist_dir / "index.html", expect_prompt_collection=False)
          for relative in ("ai-practice", "ready-to-use", "ai-assistant", "image-ai"):
              check_page_html(dist_dir / relative / "index.html", expect_prompt_collection=True)

          assert_true(not any(dist_dir.rglob("design.md")), "design.md must not be published")
          assert_true(not (dist_dir / "templates").exists(), "templates/ must not be published")
          assert_true(not (dist_dir / "design").exists(), "design/ output must not be published")

          print("Quality check validation passed")
          PY
