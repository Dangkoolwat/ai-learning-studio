<li class="timeline-step" data-step-id="{{ step_id }}">
  <p class="timeline-step__number">{{ step_number }}</p>
  <div class="timeline-step__content">
    <h2 class="timeline-step__title">{{ step_title }}</h2>
    <p class="timeline-step__description">{{ step_description }}</p>
    <p class="timeline-step__result">
      <span class="timeline-step__result-label">결과물</span>
      <span class="timeline-step__result-value">{{ step_result }}</span>
    </p>
  </div>
</li>
