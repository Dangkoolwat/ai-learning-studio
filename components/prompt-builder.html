<section class="prompt-builder" aria-label="프롬프트 작성 항목">
  <ol class="prompt-builder__fields">
    {{ prompt_fields_html }}
  </ol>
  <div class="prompt-builder__actions">
    <button type="button" class="prompt-builder__generate-btn">프롬프트 생성하기</button>
  </div>
  <div class="prompt-builder__result is-hidden">
    <h3 class="prompt-builder__result-title">생성된 완성형 프롬프트</h3>
    <pre class="prompt-item__content"><code class="prompt-builder__result-code"></code></pre>
    <div class="prompt-builder__result-actions">
      <button type="button" class="prompt-item__copy-button" data-builder-copy>프롬프트 복사</button>
    </div>
  </div>
</section>
